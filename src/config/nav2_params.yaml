lifecycle_manager:
  ros__parameters:
    use_sim_time: true
    autostart: true

    node_names:
      - controller_server
      - planner_server
      # - behavior_server
      - bt_navigator
      - waypoint_follower

planner_server:
  ros__parameters:

    use_sim_time: true

    expected_planner_frequency: 20.0

    planner_plugins:
      - GridBased

    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"

      use_final_approach_orientation: false

      tolerance: 0.5
      use_astar: false
      allow_unknown: true

controller_server:
  ros__parameters:

    use_sim_time: true

    controller_frequency: 20.0

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

    failure_tolerance: 0.3

    progress_checker_plugins:
      - progress_checker

    goal_checker_plugins:
      - general_goal_checker

    controller_plugins:
      - FollowPath

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      desired_linear_vel: 0.25
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.2  

      use_velocity_scaled_lookahead_dist: true

      transform_tolerance: 0.2

      rotate_to_heading_angular_vel: 1.0

      use_rotate_to_heading: true

      # allow_reversing: false

      max_allowed_time_to_collision_up_to_carrot: 1.0

      use_collision_detection: true

      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.3 # Triggers deceleration on turns tighter than this radius (meters)
      regulated_linear_scaling_min_speed: 0.1  # Don't let regulation completely stall the robot
      
      # --- Proximity to Obstacles Scaling ---
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.4                 # Distance to obstacles when the robot should start slowing down
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0

      # --- Differential Drive Features (Rotate to Heading) ---
      use_rotate_to_heading: true            # Highly recommended for diff-drive to align before moving
      rotate_to_heading_min_angle: 0.20      # Triggers a pivot-in-place if angle error > ~11 degrees
      max_angular_accel: 2.0                 # Crisp rotational acceleration for smaller motors
      allow_reversing: false                 # Keep false unless your global planner specifically supports reversing

      # --- Path Constraints & Safeties ---
      use_velocity_scaled_lookahead_dist: true
      max_robot_pose_search_dist: 2.0 

local_costmap:
  local_costmap:
    ros__parameters:

      use_sim_time: true

      global_frame: odom
      robot_base_frame: base_link

      update_frequency: 10.0
      publish_frequency: 5.0

      rolling_window: true

      origin_x: -5.0
      origin_y: -5.0

      width: 6
      height: 6
      resolution: 0.05

      footprint: "[[0.30, 0.20], [0.30, -0.20], [-0.30, -0.20], [-0.30, 0.20]]"
      # robot_radius: 0.45

      always_send_full_costmap: true

      transform_tolerance: 0.2

      plugins:
        - obstacle_layer
        - inflation_layer

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"

        enabled: true

        footprint_clearing_enabled: true

        combination_method: 1
        observation_sources: lidar

        lidar:
          topic: /scan
          data_type: "LaserScan"

          inf_is_valid: true

          marking: true
          clearing: true

          obstacle_max_range: 5.0
          raytrace_max_range: 6.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"

        enabled: true

        inflation_radius: 0.35

        cost_scaling_factor: 2.0

global_costmap:
  global_costmap:
    ros__parameters:

      use_sim_time: true

      global_frame: map
      robot_base_frame: base_footprint

      update_frequency: 2.0
      publish_frequency: 1.0

      rolling_window: false

      width: 50
      height: 50

      origin_x: -25.0
      origin_y: -25.0

      resolution: 0.5

      transform_tolerance: 0.2

      track_unknown_space: true

      footprint: "[[0.30, 0.20], [0.30, -0.20], [-0.30, -0.20], [-0.30, 0.20]]"
      # robot_radius: 0.45

      always_send_full_costmap: true

      plugins:
        - obstacle_layer
        - inflation_layer

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"

        footprint_clearing_enabled: true

        enabled: true

        combination_method: 1

        observation_sources: lidar

        lidar:
          topic: /scan
          data_type: "LaserScan"

          marking: true
          clearing: true

          obstacle_max_range: 8.0
          raytrace_max_range: 10.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"

        enabled: true

        inflation_radius: 0.35

        cost_scaling_factor: 2.0

behavior_server:
  ros__parameters:

    use_sim_time: true

    global_frame: map
    robot_base_frame: base_footprint

    cycle_frequency: 10.0

    behavior_plugins:
      - spin
      - backup
      - wait

    spin:
      plugin: "nav2_behaviors/Spin"

    backup:
      plugin: "nav2_behaviors/BackUp"

    wait:
      plugin: "nav2_behaviors/Wait"

    local_frame: odom

    transform_tolerance: 0.2

    simulate_ahead_time: 2.0

    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

bt_navigator:
  ros__parameters:

    use_sim_time: true

    global_frame: map
    robot_base_frame: base_footprint

    odom_topic: /odometry/local

    bt_loop_duration: 10

    default_server_timeout: 20
    default_nav_to_pose_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_w_replanning_time.xml"
    default_nav_through_poses_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_w_replanning_time.xml"

waypoint_follower:
  ros__parameters:

    use_sim_time: true

    loop_rate: 20

    stop_on_failure: false

    waypoint_task_executor_plugin: wait_at_waypoint

    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"

      enabled: true

      waypoint_pause_duration: 0